[greeter]
background=/usr/share/backgrounds/teios/login.jpg
user-background=false
theme-name=Tei
icon-theme-name=Tei
cursor-theme-name=DMZ-White
cursor-theme-size=24
font-name=Noto Sans 10
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=rgb
default-user-image=#tei-user
indicators=~host;~spacer;~clock;~spacer;~layout;~language;~a11y;~power
clock-format=%A, %d %B %Y   %H:%M
position=50%,center 48%,center
panel-position=top
round-user-image=true
