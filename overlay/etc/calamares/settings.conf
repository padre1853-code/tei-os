# WinLow XP installer
---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]

instances:
- id: tei_prepare
  module: shellprocess
  config: shellprocess_tei_prepare.conf
- id: tei_bootloader_pkgs
  module: shellprocess
  config: shellprocess_tei_bootloader_pkgs.conf
- id: tei_finish
  module: shellprocess
  config: shellprocess_tei_finish.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - luksopenswaphookcfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@tei_prepare
  - packages
  - shellprocess@tei_bootloader_pkgs
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - shellprocess@tei_finish
  - umount
- show:
  - finished

branding: teios
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
